[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Jarvis-HEP"
version = "2.0.8"
description = "Jarvis-HEP V2 distributed runtime (Redis + spawn Workers)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Jarvis-HEP Developers" },
]
dependencies = [
    "dill>=0.3.8",
    "emoji>=2.10.1",
    "h5py>=3.8",
    "jsonschema>=4.18",
    "networkx>=3.2.1",
    "numpy>=1.24",
    "Pillow>=10.0.0",
    "prettytable>=3.10.0",
    "psutil>=5.9.0",
    "scipy>=1.10",
    "sympy>=1.12",
    "PyYAML>=6.0",
    "torch>=2.0.0",
    "setproctitle>=1.3.3",
    "Jarvis-HEP-Portal>=1.5.1",
    "Jarvis-Operas>=1.4.1",
    "JarvisPLOT>=1.3.3",
    "typer>=0.25.0",
    "xmltodict>=0.13.0",
]

[project.scripts]
Jarvis = "jarvishep2.client:main"

[project.optional-dependencies]
distributed = [
    "redis>=5.0",
    "msgpack>=1.0",
    "aiofiles>=23.0",
]
# Deprecated alias: Operas is a core dependency since D12.0. Kept so existing
# `pip install '.[operas]'` scripts remain valid.
operas = [
    "Jarvis-Operas>=1.4.1",
]
plot = [
    "JarvisPLOT>=1.3.3",
]
dev = [
    "pytest>=7.0",
    "fakeredis>=2.0",
    "colorlog>=6.0",
]

[project.urls]
Homepage = "https://github.com/Pengxuan-Zhu-Phys/Jarvis-HEP"
Documentation = "https://pengxuan-zhu-phys.github.io/Jarvis-Docs/"
Repository = "https://github.com/Pengxuan-Zhu-Phys/Jarvis-HEP"
Issues = "https://github.com/Pengxuan-Zhu-Phys/Jarvis-HEP/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvishep2*"]

[tool.setuptools.package-data]
jarvishep2 = [
    "card/*",
    "card/**/*",
    "cardload/schema/*.json",
    "cardload/schema/**/*.json",
    "project_template/*",
    "project_template/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running or Redis-backed runtime tests (run with: pytest -m slow)",
]
addopts = [
    # Fast gate. tests/conftest.py drops this when a .py file is named on the CLI
    # so `pytest tests/test_mcmc_sampler.py` still runs that module.
    "-m not slow",
]

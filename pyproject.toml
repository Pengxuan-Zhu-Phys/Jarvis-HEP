[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvishep2"
version = "2.0.0.dev0"
description = "Jarvis-HEP V2 distributed runtime (Redis + spawn Workers)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "h5py>=3.8",
    "numpy>=1.24",
    "scipy>=1.10",
    "sympy>=1.12",
    "PyYAML>=6.0",
    "setproctitle>=1.3.3",
    "Jarvis-HEP-Portal>=1.3.0",
    "Jarvis-Operas>=1.3.0",
    "typer>=0.25.0",
]

[project.scripts]
Jarvis2 = "jarvishep2.client:main"

[project.optional-dependencies]
distributed = [
    "redis>=5.0",
    "msgpack>=1.0",
    "aiofiles>=23.0",
]
# Deprecated alias: Operas is a core dependency since D12.0. Kept so existing
# `pip install '.[operas]'` scripts remain valid.
operas = [
    "Jarvis-Operas>=1.3.0",
]
plot = [
    "JarvisPLOT>=1.4.0",
]
dev = [
    "pytest>=7.0",
    "fakeredis>=2.0",
    "colorlog>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["jarvishep2*"]

[tool.setuptools.package-data]
jarvishep2 = [
    "card/*",
    "card/**/*",
    "project_template/*",
    "project_template/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

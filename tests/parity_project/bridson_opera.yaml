# WP-Bridson: Poisson-disk (blue-noise) sampler smoke via TrivialEggbox opera.
Scan:
  name: bridson-opera
EnvReqs:
  V2:
    workers: 2
    batch_size: 4
Sampling:
  Method: Bridson
  Bounds:
    radius: 0.35
    max_attempt: 30
    seed: 42
  Variables:
    - name: x
      description: flat x
      distribution:
        type: Flat
        parameters:
          min: 0.0
          max: 1.0
          length: 1.0
    - name: y
      description: flat y
      distribution:
        type: Flat
        parameters:
          min: 0.0
          max: 1.0
          length: 1.0
  LogLikelihood:
    - name: LogL_Z
      expression: z
Operas:
  Modules:
    - name: TrivialEggbox
      operator: jarvishep2.testing.eggbox.eggbox2d_numpy
      call_mode: call
      input:
        - name: x
          expression: x
        - name: y
          expression: y
      output:
        - name: z
          entry: z

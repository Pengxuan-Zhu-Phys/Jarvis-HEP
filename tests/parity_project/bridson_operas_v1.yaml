# V1-shaped Eggbox/Operas compatibility smoke: intentionally no Runtime block.
Scan:
  name: v1-eggbox-bridson-operas
  save_dir: "&J/outputs"

Sampling:
  Method: Bridson
  Bounds:
    Radius: 1
    MaxAttempt: 10
    Seed: 7
  Variables:
    - name: xx
      distribution:
        type: Log
        parameters:
          min: 0.1
          max: 5.0
          length: 2
    - name: yy
      distribution:
        type: Flat
        parameters:
          min: 0.0
          max: 5.0
          length: 2
  LogLikelihood:
    - {name: LogL_Z, expression: "LogGauss(z, 100, 10)"}

Operas:
  make_paraller: 2
  Modules:
    - name: EggBox
      operator: helper.eggbox2d
      call_mode: call
      required_modules: []
      input:
        - {name: x, expression: "xx * Pi"}
        - {name: y, expression: "yy * Pi"}
      output:
        - {name: z, entry: z}

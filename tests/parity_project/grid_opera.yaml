Scan:
  name: grid-opera
EnvReqs:
  V2:
    workers: 2
    batch_size: 3
Sampling:
  Method: Grid
  Bounds:
    seed: 0
  Variables:
    - name: x
      distribution:
        type: Flat
        parameters:
          min: 0.0
          max: 1.0
          num: 3
    - name: y
      distribution:
        type: Flat
        parameters:
          min: 0.0
          max: 1.0
          num: 3
  LogLikelihood:
    - name: LogL_Z
      expression: z
Operas:
  Modules:
    - name: TrivialEggbox
      operator: jarvishep2.testing.eggbox.eggbox2d_numpy
      call_mode: call
      input:
        - name: x
          expression: x
        - name: y
          expression: y
      output:
        - name: z
          entry: z

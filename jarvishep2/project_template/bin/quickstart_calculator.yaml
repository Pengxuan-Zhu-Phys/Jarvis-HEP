# Minimal Calculator + Portal IO card (shipped with Jarvis man example calculator).
# Run: Jarvis validate bin/quickstart_calculator.yaml
# Smoke: Jarvis check bin/quickstart_calculator.yaml
Scan:
  name: "quickstart_calculator"

Sampling:
  Method: "Random"
  Bounds:
    point_number: 3
    seed: 0
  mode: check_modules
  Variables:
    - name: x
      distribution:
        type: Flat
        parameters: {min: 0.0, max: 1.0}
  LogLikelihood:
    - {name: "LogL", expression: "0.0"}

Calculators:
  Modules:
    - name: Echo
      path: "&J/calculators/echo"
      execution:
        path: "&J/calculators/echo"
        commands:
          - >-
            python3 -c "import json, pathlib; pathlib.Path('@Sdir/out.json').write_text(json.dumps({'y': 1.0}))"
        output:
          - name: out
            path: '@Sdir/out.json'
            type: JSON
            variables:
              - {name: y, entry: y}

EnvReqs:
  Check_default_dependencies:
    required: true
    default_yaml_path: "&J/deps/environment_default.yaml"
  V2:
    check_modules:
      n_samples: 3
      timeout_sec: 60

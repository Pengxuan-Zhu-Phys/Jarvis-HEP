# Scaffold quickstart: Bridson + Jarvis-Operas (no external calculator).
# Run: Jarvis run bin/quickstart_bridson_operas.yaml
Scan:
  name: "quickstart_bridson_operas"

Sampling:
  Method: "Bridson"
  Bounds:
    radius: 2.0
    max_attempt: 20
  Variables:
    - name: x
      description: "Toy variable x"
      distribution:
        type: Flat
        parameters:
          min: 0.0
          max: 5.0
          length: 40
    - name: y
      description: "Toy variable y"
      distribution:
        type: Flat
        parameters:
          min: 0.0
          max: 5.0
          length: 40
  LogLikelihood:
    - {name: "LogL_Z", expression: "LogGauss(z, 100, 10)"}

EnvReqs:
  OS:
    - name: linux
      version: ">=3.10.0"
    - name: Darwin
      version: ">=10.14"
  Check_default_dependencies:
    required: true
    default_yaml_path: "&J/deps/environment_default.yaml"
  # Optional task-local overrides (merged over defaults):
  # V2:
  #   workers: 2

Operas:
  make_parallel: 4
  Modules:
    - name: EggBox
      operator: "jarvishep2.testing.eggbox.eggbox2d_numpy"
      call_mode: call
      input:
        - {name: x, expression: "x"}
        - {name: y, expression: "y"}
      output:
        - {name: z, entry: z}

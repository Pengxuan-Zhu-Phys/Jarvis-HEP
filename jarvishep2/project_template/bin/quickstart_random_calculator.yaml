# Complete Random + Calculator + Portal JSON task card.
# Run: Jarvis validate bin/quickstart_random_calculator.yaml
# Smoke: Jarvis check bin/quickstart_random_calculator.yaml
Scan:
  name: "quickstart_random_calculator"

Sampling:
  Method: "Random"
  Bounds:
    point_number: 3
    seed: 0
  Variables:
    - name: x
      distribution:
        type: Flat
        parameters: {min: 0.0, max: 1.0}
  LogLikelihood:
    - {name: "LogL", expression: "0.0"}

Calculators:
  Modules:
    - name: Echo
      # This demo uses the project's existing bin/ directory as its working
      # directory; no external calculator pack is required.
      path: "&J/bin"
      execution:
        path: "&J/bin"
        input:
          - name: input
            path: "@Sdir/input.json"
            type: JSON
            actions:
              - type: Dump
                variables:
                  - {name: x}
        commands:
          - >-
            python3 -c "import json, pathlib; pathlib.Path('@Sdir/out.json').write_text(json.dumps({'y': 1.0}))"
        output:
          - name: out
            path: "@Sdir/out.json"
            type: JSON
            variables:
              - {name: y, entry: y}

EnvReqs:
  Check_default_dependencies:
    required: true
    default_yaml_path: "&J/deps/environment_default.yaml"
  V2:
    check_modules:
      n_samples: 3
      timeout_sec: 60

# =============================================================================
# Sampling template — Dynesty full surface (static NestedSampler)
# =============================================================================
# Engine: NestedSampler only (Bounds.dynamic: false).
# All user-facing constructor keys + static run_nested keys that HEP forwards.
#
# Do NOT set (HEP injects at runtime):
#   loglikelihood, prior_transform, ndim, pool, rstate
#
# Official dynesty docs: NestedSampler / NestedSampler.run_nested
# =============================================================================

Sampling:
  Method: "Dynesty"
  Seed: 21

  Variables:
    - name: x
      description: "Replace with your sampling parameters."
      distribution:
        type: Flat
        parameters:
          min: 0.0
          max: 1.0

  Bounds:
    # ----- HEP meta (not constructor kwargs) -----
    dynamic: false
    nlive: 200
    rseed: 21
    # Static evidence stop (also accepted under run_nested.dlogz).
    dlogz: 0.5

    # ----- NestedSampler constructor (flat and/or Bounds.sampler) -----
    # Preferred: nest under sampler: so meta keys stay clean.
    sampler:
      # nlive: 200                 # optional; Bounds.nlive is canonical
      bound: multi                 # none | single | multi | balls | cubes
      sample: auto                 # auto | unif | rwalk | slice | rslice | hslice
      # periodic: null             # list of periodic dim indices, or null
      # reflective: null           # list of reflective dim indices, or null
      # update_interval: null      # int; default ~1.5 * nlive * f
      # first_update: null         # dict, e.g. {min_ncall: 400, min_eff: 10.0}
      # queue_size: null           # default → Runtime.batch_size / workers
      # use_pool: null             # dict of booleans, e.g. {prior_transform: true, loglikelihood: true}
      # live_points: null          # advanced: pre-built live points (not typical in YAML)
      # logl_args: []
      # logl_kwargs: {}
      # ptform_args: []
      # ptform_kwargs: {}
      # enlarge: 1.25
      # bootstrap: 0
      # walks: 25                  # rwalk steps
      # facc: 0.5                  # rwalk accept fraction target
      # slices: 5                  # slice / rslice / hslice
      # ncdim: null                # clustering dimensionality override
      # blob: false
      # save_evaluation_history: false
      # history_filename: null

    # Same keys may also be listed flat under Bounds (merged; sampler: wins).

    # ----- NestedSampler.run_nested (static) -----
    run_nested:
      # maxiter: null              # default: unlimited
      # maxcall: null
      dlogz: 0.5                   # stop when remaining ΔlogZ < dlogz
      # logl_max: inf
      add_live: true               # add final live points to dead set
      print_progress: true
      # print_func: null           # custom; HEP installs Jarvis logger path
      save_bounds: true
      # checkpoint_file: null
      # checkpoint_every: 60
      # resume: false

  LogLikelihood:
    - {name: "LogL", expression: "0.0"}

  FeedbackReturn:
    mode: minimal
    include_logl: true

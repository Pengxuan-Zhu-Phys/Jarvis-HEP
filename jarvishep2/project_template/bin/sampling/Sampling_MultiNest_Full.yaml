# =============================================================================
# Sampling — MultiNest (full static NestedSampler surface)
# =============================================================================
# Engine: always static NestedSampler  (Method: MultiNest)
# Not Fortran MultiNest. Dynamic nested → Method: Dynesty / Sampling_Dynesty_Full.
#
# Product: DATABASE/multinest_result.csv
# Do NOT set (HEP injects): loglikelihood, prior_transform, ndim, pool, rstate
# Engine selection is fixed by Method; there is no Bounds.dynamic switch.
# =============================================================================

Sampling:
  Method: "MultiNest"
  Variables:
    - name: x
      description: "Replace with your parameters."
      distribution:
        type: Flat
        parameters: {min: 0.0, max: 1.0}

  Bounds:
    seed: 21
    # --- HEP meta (shared) ---
    nlive: 200
    dlogz: 0.5                 # static NestedSampler evidence stop

    # --- NestedSampler constructor ---
    sampler:
      bound: multi               # none | single | multi | balls | cubes
      sample: auto               # auto | unif | rwalk | slice | rslice | hslice
      # walks: 25
      # facc: 0.5
      # slices: 5
      # enlarge: 1.25
      # bootstrap: 0
      # update_interval: null
      # first_update: {min_ncall: 1000, min_eff: 10.0}
      # periodic: null
      # reflective: null
      # ncdim: null

    # --- NestedSampler.run_nested (static only — no batch / n_effective here) ---
    run_nested:
      # maxiter: null
      # maxcall: null
      # dlogz: 0.5               # or Bounds.dlogz only
      # logl_max: .inf
      # add_live: true
      print_progress: true
      # save_bounds: true
      # checkpoint_file: null
      # checkpoint_every: 60
      # resume: false

  LogLikelihood:
    - {name: "LogL", expression: "0.0"}

# =============================================================================
# Sampling — Dynesty (simple)
# =============================================================================
# Engine: always DynamicNestedSampler  (Method: Dynesty)
# Static nested sampling → Method: MultiNest instead (no Bounds.dynamic switch).
#
# Everyday knobs only. Full surface: Sampling_Dynesty_Full.yaml
# =============================================================================

Sampling:
  Method: "Dynesty"
  Variables:
    - name: x
      description: "Replace with your parameters."
      distribution:
        type: Flat
        parameters: {min: 0.0, max: 1.0}
    # - name: y
    #   description: "…"
    #   distribution:
    #     type: Flat
    #     parameters: {min: 0.0, max: 1.0}

  Bounds:
    seed: 21
    nlive: 100                 # live points (also Dynamic nlive_init default)
    dlogz: 0.5                 # → run_nested.dlogz_init (initial-phase stop)

    # Optional proposal knobs (official dynesty names):
    # bound: multi             # none | single | multi | balls | cubes
    # sample: auto             # auto | unif | rwalk | slice | rslice | hslice
    # walks: 25                # if sample: rwalk

    run_nested:
      print_progress: true
      # Safety caps (optional):
      # maxcall: 100000
      # maxiter: 50000
      # maxbatch: 100
      # n_effective: 10000     # ESS target when use_stop is on

  LogLikelihood:
    - {name: "LogL", expression: "0.0"}   # replace

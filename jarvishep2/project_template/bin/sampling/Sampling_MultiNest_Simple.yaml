# =============================================================================
# Sampling — MultiNest (simple)
# =============================================================================
# Engine: always static NestedSampler  (Method: MultiNest)
# Not Fortran MultiNest / pymultinest — same vendored dynesty stack as Dynesty.
# Dynamic nested sampling → Method: Dynesty instead.
#
# Everyday knobs only. Full surface: Sampling_MultiNest_Full.yaml
# =============================================================================

Sampling:
  Method: "MultiNest"
  Variables:
    - name: x
      description: "Replace with your parameters."
      distribution:
        type: Flat
        parameters: {min: 0.0, max: 1.0}
    # - name: y
    #   description: "…"
    #   distribution:
    #     type: Flat
    #     parameters: {min: 0.0, max: 1.0}

  Bounds:
    Seed: 21
    nlive: 100
    dlogz: 0.5                 # static NestedSampler evidence stop

    # Optional proposal knobs:
    # bound: multi
    # sample: auto
    # walks: 25

    run_nested:
      print_progress: true
      # Safety caps (optional):
      # maxcall: 100000
      # maxiter: 50000

  LogLikelihood:
    - {name: "LogL", expression: "0.0"}   # replace

# =============================================================================
# Sampling template — MultiNest (simple)
# =============================================================================
# Engine: always static NestedSampler (V2 MultiNest is NOT Fortran MultiNest /
# pymultinest). Same Redis + UUID + Worker path as Dynesty static.
#
# Bounds.dynamic is ignored / forced false. Use few knobs for smoke & daily runs.
#
# Full surface: Sampling_MultiNest_Full.yaml
# Dynesty dynamic alternative: Sampling_Dynesty_Simple.yaml
# =============================================================================

Sampling:
  Method: "MultiNest"
  Seed: 21

  Variables:
    - name: x
      description: "Replace with your sampling parameters."
      distribution:
        type: Flat
        parameters:
          min: 0.0
          max: 1.0

  Bounds:
    # Always static NestedSampler (dynamic: true is ignored).
    nlive: 100
    rseed: 21
    dlogz: 0.5                     # static evidence stop

    # Optional:
    # bound: multi
    # sample: auto
    # walks: 25

    run_nested:
      print_progress: true
      # maxcall: 100000
      # maxiter: 50000

  LogLikelihood:
    - {name: "LogL", expression: "0.0"}

  FeedbackReturn:
    mode: minimal
    include_logl: true

# Jarvis-HEP V2 default runtime policy for scaffolded projects.
# Loaded via EnvReqs.Check_default_dependencies.default_yaml_path.
EnvReqs:
  V2:
    workers: 4
    batch_size: 256

    sample_directory:
      enabled: true
      limit: 200
      width: 6
      pack: true
      start_bucket: 1

    cleanup:
      strategy: direct

    archiver:
      mode: process
      handoff: direct
      pack_buckets: true
      batch_size: 200
      flush_interval_sec: 1.0
      # Seal and convert each HDF5 shard after 1 GiB (bytes).
      max_hdf5_bytes: 1073741824
      delete_after_archive: true

    # Optional redis/factory/worker groups — see EnvReqs.V2 docs (D12.4).
    # redis:
    #   host: 127.0.0.1
    #   port: 6379
    #   db: 0

    # Jarvis2 check / --check-modules (CSV fixed points, else n_samples from Method).
    # Runtime always forces workers=1, SAMPLE/test/, no tar pack.
    check_modules:
      data: "&J/data/check_modules_points.csv"
      n_samples: 10

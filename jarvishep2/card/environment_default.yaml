# Jarvis-HEP V2 default runtime policy (EnvReqs.Check_default_dependencies.default_yaml_path).
# Only EnvReqs.V2 is merged by the V2 loader; task YAML overrides take precedence.
EnvReqs:
  # V1-compatible preflight checks. Set CERN_ROOT.required: true for ROOT-based
  # calculators; the check runs before Redis, Workers, and Archiver startup.
  Python:
    version: ">=3.10"
  CERN_ROOT:
    required: false
    version: ">=6.20"
    get_path_command: "root-config --prefix"
    Dependencies:
      - name: minuit2
        required: false
        check_command: "root-config --has-minuit2"
        expected_output: "yes"

  V2:
    workers: 4
    batch_size: 256

    # SAMPLE layout: SAMPLE/<bucket_id>/<uuid>/  (default ON, V1 sample_directory parity)
    sample_directory:
      enabled: true
      limit: 200
      width: 6
      pack: true
      start_bucket: 1

    # Layer-2 archive: DATABASE writes + sealed-bucket tar.gz packing.
    archiver:
      mode: process
      pack_buckets: true
      batch_size: 200
      flush_interval_sec: 1.0
      # Seal and convert each HDF5 shard after 1 GiB (bytes).
      max_hdf5_bytes: 1073741824
      delete_after_archive: true

    # Per-project Redis broker. If this port is occupied, Jarvis selects a
    # free replacement and writes it back here before the scan begins.
    redis:
      host: 127.0.0.1
      port: 6379
      db: 0

    # Reserved monitor interface; runtime monitor behavior is not active yet.
    monitor:
      hz: 120

    # Optional factory / worker policy (defaults match code).
    # factory:
    #   watchdog:
    #     enabled: true
    #     stale_sec: 30
    #     poll_interval_sec: 1.0
    #     max_sample_retries: 3
    # worker:
    #   force_serial_layers: false
    #   sample_artifacts: auto

    # Jarvis check:
    #   1) Use this CSV when the file exists.
    #   2) If missing, draw n_samples points from Sampling.Method (V1-like smoke).
    #   3) timeout_sec: max wait for samples to archive (deadline; CLI --timeout overrides).
    # Runtime policy (always, not YAML): workers=1, SAMPLE/test/, pack=off.
    check_modules:
      data: "&J/data/check_modules_points.csv"
      n_samples: 10
      timeout_sec: 120

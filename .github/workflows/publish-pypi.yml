name: Verify Jarvis-HEP release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Test and build release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install release test tools and Redis
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest fakeredis colorlog tomli
          sudo apt-get update
          sudo apt-get install -y redis-server

      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomli as tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          name = project["name"]
          version = project["version"]
          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          init_text = Path("jarvishep2/__init__.py").read_text(encoding="utf-8")

          if name != "Jarvis-HEP":
              raise SystemExit(f"Refusing release: project.name is {name!r}, expected 'Jarvis-HEP'")
          if version != tag_version:
              raise SystemExit(f"Refusing release: tag version {tag_version!r} != project version {version!r}")
          if int(version.split(".", 1)[0]) < 2:
              raise SystemExit(f"Refusing release: {version!r} is not a V2-or-later version")
          if f'__version__ = "{version}"' not in init_text:
              raise SystemExit("Refusing release: jarvishep2.__version__ does not match pyproject.toml")
          PY

      - name: Prepare and verify complete distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Install complete wheel
        run: python -m pip install dist/*.whl

      # Plugin tests load SliceMCMC from the sibling checkout
      # ../Jarvis-HEP-Sampler/examples. This job only checks out Jarvis-HEP
      # and installs wheels. Wheels omit examples; the matching sdist has them.
      - name: Place published sampler examples beside the checkout
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from importlib.metadata import PackageNotFoundError, version
          from pathlib import Path

          try:
              installed = version("Jarvis-HEP-Sampler")
          except PackageNotFoundError as exc:
              raise SystemExit(
                  "Jarvis-HEP-Sampler is not installed; install the release wheel first"
              ) from exc

          repo = Path(os.environ.get("GITHUB_WORKSPACE") or Path.cwd()).resolve()
          target = repo.parent / "Jarvis-HEP-Sampler"
          examples = target / "examples"
          needed = ("SliceMCMC.py", "SliceMCMC.eggbox.task.yaml")
          if all((examples / name).is_file() for name in needed):
              print(f"sampler examples already present: {examples}")
              raise SystemExit(0)

          download = Path("/tmp/jarvis-sampler-sdist")
          download.mkdir(parents=True, exist_ok=True)
          subprocess.check_call(
              [
                  sys.executable, "-m", "pip", "download",
                  f"Jarvis-HEP-Sampler=={installed}",
                  "--no-binary", ":all:",
                  "--no-deps",
                  "-d", str(download),
              ]
          )
          archives = sorted(download.glob("*.tar.gz"))
          if len(archives) != 1:
              raise SystemExit(f"expected one Jarvis-HEP-Sampler sdist, found {archives}")

          extract = Path("/tmp/jarvis-sampler-src")
          extract.mkdir(parents=True, exist_ok=True)
          subprocess.check_call(["tar", "-xzf", str(archives[0]), "-C", str(extract)])
          roots = [
              path for path in extract.iterdir()
              if all((path / "examples" / name).is_file() for name in needed)
          ]
          if len(roots) != 1:
              raise SystemExit(
                  "sdist is missing examples/SliceMCMC.py or "
                  f"examples/SliceMCMC.eggbox.task.yaml: {list(extract.iterdir())}"
              )
          if target.exists() or target.is_symlink():
              raise SystemExit(f"refusing to replace {target}")
          target.symlink_to(roots[0].resolve(), target_is_directory=True)
          print(f"linked {target} -> {roots[0].resolve()} (Jarvis-HEP-Sampler {installed})")
          PY

      - name: Run fast gate
        run: python -m pytest -q

      - name: Store built distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

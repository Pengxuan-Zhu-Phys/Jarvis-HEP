name: Publish Jarvis-HEP to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Test and build release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          name = project["name"]
          version = project["version"]
          tag_version = os.environ["RELEASE_TAG"].removeprefix("v")
          init_text = Path("jarvishep2/__init__.py").read_text(encoding="utf-8")

          if name != "Jarvis-HEP":
              raise SystemExit(f"Refusing release: project.name is {name!r}, expected 'Jarvis-HEP'")
          if version != tag_version:
              raise SystemExit(f"Refusing release: tag version {tag_version!r} != project version {version!r}")
          if int(version.split(".", 1)[0]) < 2:
              raise SystemExit(f"Refusing release: {version!r} is not a V2-or-later version")
          if f'__version__ = "{version}"' not in init_text:
              raise SystemExit("Refusing release: jarvishep2.__version__ does not match pyproject.toml")
          PY

      - name: Install test and build tools
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install '.[distributed,dev]'

      - name: Run test suite
        run: python -m pytest -q

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: |
          python -m twine check dist/*
          python - <<'PY'
          import email
          import zipfile
          from pathlib import Path

          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"Expected one wheel and one sdist, found {wheels!r} and {sdists!r}")

          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_path = next(
                  name for name in archive.namelist() if name.endswith(".dist-info/METADATA")
              )
              metadata = email.message_from_bytes(archive.read(metadata_path))
              members = archive.namelist()

          if metadata["Name"] != "Jarvis-HEP":
              raise SystemExit(f"Wheel name is {metadata['Name']!r}, expected 'Jarvis-HEP'")
          if not any(name.startswith("jarvishep2/") for name in members):
              raise SystemExit("Wheel does not contain the jarvishep2 import package")
          if any(name.startswith("jarvishep/") for name in members):
              raise SystemExit("Wheel unexpectedly contains the retired jarvishep V1 package")
          PY

      - name: Store built distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/Jarvis-HEP/
    permissions:
      id-token: write
    steps:
      - name: Download built distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
